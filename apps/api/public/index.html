<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3T Ai</title>
<style>
  :root { color-scheme:light; --bg:#f3f5f8; --card:#fff; --ink:#18273d; --muted:#64738a; --line:#e1e7ef; --accent:#2859cf; --accent-soft:#edf2ff; --warn:#fff8e7; --bad:#b42318; --good:#14765b; --shadow:0 4px 20px #152b4b05; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 "Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  button,input,select,textarea { font:inherit; }
  a { color:var(--accent); text-underline-offset:3px; }
  a:hover { text-decoration-thickness:2px; }
  header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:16px; padding:16px max(24px,calc((100vw - 1480px)/2)); background:var(--card); border-bottom:1px solid var(--line); }
  header > .error { flex-basis:100%; order:3; }
  .brand-nav,.brand,.user-menu,nav { display:flex; align-items:center; gap:10px; }
  .brand-nav { gap:32px; }
  .brand { gap:11px; }
  .brand strong { font-size:18px; letter-spacing:1px; }
  .brand small { display:block; font-size:10px; font-weight:600; color:var(--muted); letter-spacing:1.4px; text-transform:uppercase; }
  .brand-mark { display:grid; place-items:center; flex-shrink:0; width:34px; height:51px; }
  .brand-mark img { display:block; width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; }
  .user-menu { flex-wrap:wrap; gap:8px; }
  .user-email { font-size:12px; color:var(--muted); }
  nav { gap:4px; }
  nav button { border-color:transparent; background:transparent; color:var(--muted); box-shadow:none; }
  nav button.nav-active { background:var(--accent-soft); color:var(--accent); }
  main { width:100%; max-width:1480px; margin:0 auto; padding:30px 24px 56px; display:grid; gap:24px; align-items:start; }
  main.two { grid-template-columns:260px minmax(0,1fr); }
  section,.card { min-width:0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:var(--shadow); }
  .client-sidebar { padding:20px; }
  .page-heading { margin-bottom:24px; }
  .page-heading p { margin:5px 0 0; }
  .eyebrow { display:block; color:var(--accent); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.8px; margin-bottom:8px; }
  h1,h2,h3 { margin:0 0 10px; line-height:1.3; }
  h1 { font-size:26px; letter-spacing:-.7px; font-weight:650; }
  h2 { font-size:22px; letter-spacing:-.5px; font-weight:650; }
  h3 { font-size:15px; font-weight:650; color:var(--ink); }
  p { margin:10px 0 16px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:16px 0 6px; }
  input,select,textarea { width:100%; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); transition:border-color .15s,box-shadow .15s; }
  input:hover,select:hover,textarea:hover { border-color:#a6b5cb; }
  input::placeholder,textarea::placeholder { color:#8592a5; }
  input[type=checkbox],input[type=radio] { width:auto; accent-color:var(--accent); margin-right:6px; }
  input[type=file] { padding:16px; background:var(--bg); border-style:dashed; }
  input[type=file]::file-selector-button { border:0; border-radius:5px; background:var(--accent-soft); color:var(--accent); padding:6px 10px; margin-right:12px; font:inherit; font-weight:600; cursor:pointer; }
  input:disabled,select:disabled,textarea:disabled { background:var(--bg); color:var(--muted); }
  button { padding:9px 13px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-size:12px; line-height:1.45; font-weight:600; cursor:pointer; transition:background .15s,border-color .15s; }
  button:hover:not(:disabled) { background:var(--bg); border-color:#b8c6d9; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 2px 3px #2859cf15; }
  button.primary:hover:not(:disabled) { background:#1f49b0; border-color:#1f49b0; }
  button:disabled { opacity:.48; cursor:not-allowed; }
  :focus-visible { outline:3px solid #668ded; outline-offset:3px; }
  input:focus,select:focus,textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .row > div { min-width:0; }
  .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 20px; }
  .list { margin:16px 0; max-height:440px; overflow:auto; }
  .list button { display:block; width:100%; text-align:left; margin-bottom:5px; padding:12px; border-color:transparent; border-left:3px solid transparent; background:transparent; }
  .list button.active { border-left-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .warn { background:var(--warn); border:1px solid #ead9a6; padding:15px 18px; border-radius:10px; margin:16px 0; font-size:13px; overflow-wrap:anywhere; }
  .warn h3 { margin-bottom:12px; }
  .error { color:var(--bad); margin-top:10px; font-size:13px; overflow-wrap:anywhere; }
  .error:empty { display:none; }
  .muted { color:var(--muted); font-size:12px; line-height:1.65; }
  .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:22px 0; }
  .metric { padding:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  .metric strong { display:block; font-size:25px; font-weight:650; line-height:1.25; letter-spacing:-.7px; font-variant-numeric:tabular-nums; }
  .metric span { display:block; color:var(--muted); font-size:11px; font-weight:600; margin-top:5px; }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:6px; font-size:11px; line-height:1.4; font-weight:650; background:#edf0f5; color:#52637a; white-space:normal; }
  .badge.good { background:#e7f4ee; color:#13664d; }
  .badge.info { background:#eaf0ff; color:#2857b7; }
  .badge.pending { background:#fff1d5; color:#86530a; }
  .badge.bad { background:#ffedea; color:#a22d23; }
  .table-wrap { width:100%; max-width:100%; overflow:auto; margin:20px 0; border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:var(--bg); color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; white-space:nowrap; }
  td,th { text-align:left; padding:15px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  tr:hover td { background:var(--bg); }
  td:first-child { min-width:170px; }
  td > a:first-child { font-weight:600; text-decoration:none; }
  td > button { display:inline-block; margin:0 4px 6px 0; }
  td:last-child { max-width:280px; }
  .site-note { margin-top:9px; font-size:11px; line-height:1.6; overflow-wrap:anywhere; }
  .results-panel { margin:28px 0; padding:24px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .result-list { display:grid; gap:14px; margin-top:20px; }
  .result-card { padding:20px; border:1px solid var(--line); border-radius:10px; background:var(--card); overflow-wrap:anywhere; }
  .result-card-heading { display:flex; flex-wrap:wrap; align-items:start; justify-content:space-between; gap:12px; margin-bottom:8px; }
  .result-card h4 { font-size:14px; margin:0 0 3px; }
  .result-card p { margin:12px 0; font-size:13px; }
  .result-evidence { background:var(--bg); padding:12px 14px; border-radius:7px; font-size:12px; }
  .result-evidence strong { color:var(--muted); font-size:11px; }
  .result-evidence blockquote { margin:8px 0 0; padding-left:12px; border-left:2px solid var(--line); white-space:pre-wrap; }
  .result-guidance { color:var(--muted); }
  .result-link { font-size:12px; font-weight:600; margin-right:8px; }
  .tools-panel { margin:22px 0; padding:16px 18px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  .tools-panel summary { font-size:13px; font-weight:650; cursor:pointer; }
  .tools-panel[open] summary { margin-bottom:18px; }
  .auth-layout { max-width:460px; margin:9vh auto 0; }
  .auth-layout section { padding:34px; }
  .auth-layout .brand { margin-bottom:30px; }
  .auth-layout h1 { font-size:23px; }
  .auth-layout .primary { width:100%; padding:12px; }
  .welcome-card { padding:48px; min-height:360px; }
  .welcome-card p { max-width:540px; }
  .workflow { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:32px; padding-top:25px; border-top:1px solid var(--line); }
  .workflow strong { display:block; margin-bottom:5px; font-size:13px; }
  .workflow .step-number { display:block; font-size:11px; color:var(--accent); font-weight:700; margin-bottom:10px; }
  #app { min-height:100vh; }
  @media(prefers-color-scheme:dark) {
    :root { color-scheme:dark; --bg:#111922; --card:#192330; --ink:#e6edf7; --muted:#a3b1c5; --line:#2b3a4e; --accent:#91afff; --accent-soft:#253755; --warn:#342d1d; --bad:#ffa99f; --good:#80d4b4; --shadow:none; }
    button.primary { background:#426dd5; border-color:#426dd5; color:#fff; }
    .brand-mark img { filter:invert(1); mix-blend-mode:screen; }
    nav button.nav-active { color:#bdd0ff; }
    .badge { background:#293649; color:#bac8dc; }
    .badge.good { background:#173d32; color:#91daba; }
    .badge.info { background:#263c63; color:#b6cdff; }
    .badge.pending { background:#493a21; color:#f3cf8a; }
    .badge.bad { background:#482a29; color:#ffb5ac; }
    .warn { border-color:#655331; }
  }
  @media(max-width:1000px) { .brand-nav { gap:18px; } .user-email { display:none; } main.two { grid-template-columns:220px minmax(0,1fr); } section { padding:22px; } }
  @media(max-width:760px) { header { padding:14px 16px; gap:12px; } .brand-nav { width:100%; justify-content:space-between; gap:8px; } .brand small { display:none; } main,main.two { grid-template-columns:1fr; padding:18px 12px 36px; gap:16px; } section,.card { padding:20px; border-radius:11px; } .client-sidebar .list { max-height:180px; } .grid2 { grid-template-columns:1fr; } .workflow { grid-template-columns:1fr; } .welcome-card { min-height:0; } .row input[style] { min-width:0!important; } .auth-layout { margin-top:4vh; } .metrics { grid-template-columns:repeat(2,1fr); } }
  @media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
