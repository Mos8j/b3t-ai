services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ucaas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ucaas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]   # only reachable from this computer
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
  minio:
    image: quay.io/minio/minio     # MinIO now publishes here instead of Docker Hub
    profiles: ["storage"]          # optional: only started when document storage is needed
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
volumes:
  pgdata:
  redisdata:
  miniodata:
